name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mnemo
          POSTGRES_PASSWORD: mnemo
          POSTGRES_DB: mnemo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MNEMO_TEST_POSTGRES_URL: postgresql://mnemo:mnemo@localhost:5432/mnemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=mnemo --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mnemo:ci .
      - name: Smoke test
        run: |
          docker run -d --name mnemo -p 8000:8000 mnemo:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/v1/memories -H 'content-type: application/json' \
            -d '{"messages": "smoke test", "user_id": "ci", "infer": false}'
          curl -fs -X POST localhost:8000/v1/memories/search -H 'content-type: application/json' \
            -d '{"query": "smoke", "user_id": "ci"}' | grep -q "smoke test"
      - name: Logs
        if: always()
        run: docker logs mnemo
