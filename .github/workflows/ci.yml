name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mnemo
          POSTGRES_PASSWORD: mnemo
          POSTGRES_DB: mnemo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MNEMO_TEST_POSTGRES_URL: postgresql://mnemo:mnemo@localhost:5432/mnemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=mnemo --cov-report=term-missing
