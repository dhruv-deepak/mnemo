# Full stack: mnemo API + Postgres with pgvector.
#   cp .env.example .env   # add your GROQ_API_KEY
#   docker compose up --build
#   open http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD: mnemo
      POSTGRES_DB: mnemo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      MNEMO_STORE: postgres
      MNEMO_POSTGRES_URL: postgresql://mnemo:mnemo@db:5432/mnemo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
