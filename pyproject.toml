[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mnemo-memory"
version = "0.1.0"
description = "Long-term memory layer for LLM agents: fact extraction, conflict resolution, hybrid retrieval and a lightweight knowledge graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dhruv Deepak", email = "dhruv.deepak21@gmail.com" }]
requires-python = ">=3.11"
keywords = ["llm", "agents", "memory", "rag", "mcp", "vector-search", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastembed>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
]
postgres = ["psycopg[binary,pool]>=3.1", "pgvector>=0.3"]
mcp = ["mcp>=2.0"]
demo = ["streamlit>=1.35"]
bench = ["tiktoken>=0.7"]
tracing = ["langfuse>=2.0"]
all = ["mnemo-memory[server,postgres,mcp,demo,bench]"]
dev = [
    "mnemo-memory[server,postgres,mcp,bench]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
mnemo = "mnemo.cli:main"

[project.urls]
Repository = "https://github.com/dhruv-deepak/mnemo"

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires a running Postgres with pgvector (set MNEMO_TEST_POSTGRES_URL)"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["mnemo"]
